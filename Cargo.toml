[package]
name = "pq-solana-lab"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Applied research prototype: post-quantum signatures for application authorization on Solana"

[dependencies]
# Classical baseline (RFC 8032 Ed25519). Pinned exact version.
ed25519-dalek = "=3.0.0"
# FIPS 204 ML-DSA. Pinned exact version; only the ML-DSA-44 parameter set is
# compiled. default-rng gives OS-backed randomness inside the library.
fips204 = { version = "=0.4.6", default-features = false, features = [
    "default-rng",
    "ml-dsa-44",
] }
# OS randomness for Ed25519 seed generation (libraries use different
# rand_core trait versions; each adapter uses the API compatible with it).
getrandom = "=0.4.3"
# Config files and result metadata/summaries for the benchmark harness.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
# Documented measurement profile for all host benchmarks in this project.
opt-level = 3
debug = false
lto = false
codegen-units = 16
